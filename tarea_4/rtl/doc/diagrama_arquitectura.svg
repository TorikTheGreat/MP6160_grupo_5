<polygon fill="#ffffe0" stroke="black" points="936,-728 578,-728 578,-504 942,-504 942,-722 936,-728"/>
<polyline fill="none" stroke="black" points="936,-728 936,-722 "/>
<polyline fill="none" stroke="black" points="942,-722 936,-722 "/>
<text text-anchor="start" x="590" y="-714" font-family="DejaVu Sans" font-weight="bold" font-size="10.00">Flujo del sistema</text>
<text text-anchor="start" x="590" y="-704" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="590" y="-694" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;① el CPU carga la imagen RAW RGB 1080p (6 220 800 B)</text>
<text text-anchor="start" x="590" y="-684" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;② la escribe en la RAM, &#160;SRC = 0x0001_0000</text>
<text text-anchor="start" x="590" y="-674" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;③ configura el acelerador por MMIO: SRC, DST, NUM_PIXELS</text>
<text text-anchor="start" x="590" y="-664" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;④ el acelerador lee RGB y escribe gris, &#160;DST = 0x0100_0000</text>
<text text-anchor="start" x="590" y="-654" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;⑤ el CPU relee el resultado (2 073 600 B)</text>
<text text-anchor="start" x="590" y="-644" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;⑥ y lo guarda a disco</text>
<text text-anchor="start" x="590" y="-634" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="590" y="-624" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="624" y="-624" font-family="DejaVu Sans" font-weight="bold" font-size="10.00">Cómo leer los bloques</text>
<text text-anchor="start" x="590" y="-614" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Verde: implementado y verificado.</text>
<text text-anchor="start" x="590" y="-604" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Discontinuo: especificado, pendiente de integrar.</text>
<text text-anchor="start" x="590" y="-594" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="590" y="-584" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="624" y="-584" font-family="DejaVu Sans" font-weight="bold" font-size="10.00">Lo que cambia respecto al modelo previo</text>
<text text-anchor="start" x="590" y="-574" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;La RAM deja de ser un sc_module. Los dos iniciadores que la</text>
<text text-anchor="start" x="590" y="-564" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;usaban — el CPU y el acelerador — llegan ahora al mismo</text>
<text text-anchor="start" x="590" y="-554" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;esclavo AXI4 por el puente, serializados por el proxy.</text>
<text text-anchor="start" x="590" y="-544" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="590" y="-534" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Los caminos de verificación (UVM) y de integración (DPI)</text>
<text text-anchor="start" x="590" y="-524" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;atacan el mismo DUT por la misma interfaz, pero no coexisten</text>
<text text-anchor="start" x="590" y="-514" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;en una misma simulación.</text>
</g>
</g>
</svg>
